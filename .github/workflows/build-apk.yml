name: Build BRIPORT APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: BRIPORT_REPO_FINAL

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build BRIPORT APK
        run: gradle assembleDebug --no-daemon

      - name: Upload BRIPORT APK
        uses: actions/upload-artifact@v4
        with:
          name: BRIPORT-APK
          path: BRIPORT_REPO_FINAL/app/build/outputs/apk/debug/*.apk
