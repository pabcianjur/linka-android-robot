name: Build BRIPORT RELEASE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build RELEASE APK
        run: gradle assembleRelease --no-daemon

      - name: Generate signing key
        run: |
          keytool -genkeypair \
            -v \
            -keystore briport-release.jks \
            -alias briport \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -storepass changeit \
            -keypass changeit \
            -dname "CN=BRIPORT, OU=Pelaporan, O=BRIPORT, L=Cianjur, ST=Jawa Barat, C=ID"

      - name: Sign RELEASE APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)

          $APKSIGNER sign \
            --ks briport-release.jks \
            --ks-pass pass:changeit \
            --key-pass pass:changeit \
            --out app/build/outputs/apk/release/briport-release-signed.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Verify RELEASE APK
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)

          $APKSIGNER verify \
            --verbose \
            app/build/outputs/apk/release/briport-release-signed.apk

      - name: Upload BRIPORT RELEASE APK
        uses: actions/upload-artifact@v4
        with:
          name: BRIPORT-RELEASE-APK
          path: app/build/outputs/apk/release/briport-release-signed.apk
